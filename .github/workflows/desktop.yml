name: Windows build

# Builds the WARCORE Windows installer (.msi and setup .exe) on every push to main.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles msi,nsis
        env:
          # Address of the deployed match server, e.g. wss://warcore.example.com
          VITE_SERVER_URL: ${{ vars.WARCORE_SERVER_URL || 'ws://164.132.206.49' }}
      - uses: actions/upload-artifact@v4
        with:
          name: WARCORE-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
