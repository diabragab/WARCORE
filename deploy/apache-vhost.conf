# WARCORE site for Apache (Laragon or any Apache 2.4.47+ with mod_proxy, mod_proxy_http, mod_ssl).
# install-windows.ps1 fills in __DOMAIN__, __PORT__, __ACME__, __CERT__ and __KEY__ and copies it into sites-enabled.
# Only requests for __DOMAIN__ reach this site; other sites on the server are unaffected.

<VirtualHost *:80>
    ServerName __DOMAIN__
    ServerAlias www.__DOMAIN__
    Alias "/.well-known/acme-challenge/" "__ACME__/.well-known/acme-challenge/"
    <Directory "__ACME__">
        Require all granted
    </Directory>
    ProxyPreserveHost On
    ProxyPass "/.well-known/acme-challenge/" "!"
    ProxyPass "/" "http://127.0.0.1:__PORT__/" upgrade=websocket timeout=3600
    ProxyPassReverse "/" "http://127.0.0.1:__PORT__/"
</VirtualHost>

<VirtualHost *:443>
    ServerName __DOMAIN__
    ServerAlias www.__DOMAIN__
    SSLEngine on
    SSLCertificateFile    "__CERT__"
    SSLCertificateKeyFile "__KEY__"
    Alias "/.well-known/acme-challenge/" "__ACME__/.well-known/acme-challenge/"
    <Directory "__ACME__">
        Require all granted
    </Directory>
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass "/.well-known/acme-challenge/" "!"
    ProxyPass "/" "http://127.0.0.1:__PORT__/" upgrade=websocket timeout=3600
    ProxyPassReverse "/" "http://127.0.0.1:__PORT__/"
</VirtualHost>
