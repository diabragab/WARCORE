# Runs the game + match server behind Caddy, which gets a free HTTPS certificate for your domain.
# Usage on the server:  DOMAIN=warcore.example.com docker compose up -d --build
# Leave DOMAIN empty to serve plain HTTP on the server IP until a domain is ready.
services:
  tanks:
    build: ..
    restart: unless-stopped
    environment:
      PORT: 8787
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The site Caddy serves: your domain (HTTPS) or :80 (plain HTTP on the IP)
      SITE: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - tanks
volumes:
  caddy_data:
  caddy_config:
