# Runs the game + match server.
# - Own server (nothing else on ports 80/443): the "caddy" profile adds Caddy, which gets a free HTTPS
#   certificate for DOMAIN. Leave DOMAIN empty to serve plain HTTP on the server IP.
# - Shared server (an existing nginx/Apache already owns 80/443): run without the profile; the game listens on
#   127.0.0.1:WARCORE_PORT and your web server proxies the domain to it. deploy/install.sh picks the mode for you.
services:
  tanks:
    build: ..
    restart: unless-stopped
    environment:
      PORT: 8787
      DATA_DIR: /data
    volumes:
      - warcore_data:/data
    ports:
      - "127.0.0.1:${WARCORE_PORT:-8787}:8787"
  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The site Caddy serves: your domain (HTTPS) or :80 (plain HTTP on the IP)
      SITE: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - tanks
volumes:
  warcore_data:
  caddy_data:
  caddy_config:
